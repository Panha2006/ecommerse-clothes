<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <section class="latest-products">
      <h2 class="section-title">Latest Product</h2>

      <div class="product-grid">
        <!-- Card Item (Repeat 4 times for your 4 columns) -->
        <div class="product-card">
          <div class="card-img-box">
            <span class="badge badge-bestseller">BestSeller</span>
            <span class="badge badge-organic">Organic</span>

            <img src="./images/jacket.jpg" alt="Denim Jacket" />

            <!-- Hover action icons -->
            <div class="card-hover-icons">
              <button class="hover-btn">
                <i class="fa-solid fa-cart-shopping"></i>
              </button>
              <button class="hover-btn">
                <i class="fa-regular fa-eye"></i>
              </button>
              <button class="hover-btn">
                <i class="fa-regular fa-heart"></i>
              </button>
            </div>
          </div>

          <div class="card-info">
            <span class="category">Men • Casual T-shirt</span>
            <h3 class="product-name">Premium Cotton T-shirt</h3>

            <div class="rating">
              <span class="stars">★★★★★</span>
              <span class="score">4.5 (128)</span>
            </div>

            <div class="price-box">
              <span class="current-price">$79.99</span>
              <span class="old-price">$99.99</span>
              <span class="save-price">save $20.00</span>
            </div>

            <div class="colors">
              <span>Colors:</span>
              <span class="color-dot blue"></span>
              <span class="color-dot black"></span>
              <span class="color-dot white"></span>
            </div>

            <button class="add-cart-btn">
              <i class="fa-solid fa-cart-shopping"></i> Add To Cart
            </button>
          </div>
        </div>
        <!-- End Card Item -->
      </div>
    </section>
  </body>
</html>
